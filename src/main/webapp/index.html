<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    </head>
    <body>
        <div>
            <h1>Inicio de sesión</h1>
            <form id="loginForm">
                <label for="usuario">Usuario:</label>
                <br>
                <input type="text" id="usuario" name="usuario" required>
                <br><br>

                <label for="password">Contraseña:</label>
                <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 15px;">
                    <input type="password" id="password" name="password" required>
                    <button type="button" id="togglePassword">Mostrar</button>
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>
            <p id="error-message" style="color: red;"></p> <!-- Mensaje de error -->
            <p>Si aún no tienes ninguna cuenta de encargado, <a href="primerusuario.html">haz click aquí</a></p>   
        </div>
        <div id="div-sesion" style="display: none; background-color: lightgray; width: 200px; align-items: center; margin-bottom: 15px; padding: 10px">
            <h2>Sesión iniciada</h2>
            <p id = "nombre-sesion">Nombre (rol)</p>
            <button id="iniciar-sesion">Área personal</button>
            <button id="cerrar-sesion">Cerrar sesión</button>
        </div>
        <div>
            <p id="textocustom" style="color: gray; font-style: italic"></p>
        </div>

        <script>
            
            $(document).ready(function () {
                
                // Logica para el div de sesion iniciada
                let divsesion = document.getElementById("div-sesion");
                $.ajax({
                    url: "GetUser", // URL del servlet que devuelve los datos del usuario
                    type: "GET",
                    success: function (response) {
                        // Muestra los datos del usuario o los oculta
                        try {
                            $("#nombre-sesion").text(response.usuario + " (" + response.rol + ")");
                            divsesion.style.display = "block";
                        } catch (error) {
                            divsesion.style.display = "none";
                        }
                    },
                    error: function () {
                        divsesion.style.display = "none";
                    }
                });
                
                // Logica del boton de mostrar contraseña
                $("#togglePassword").click(function () {
                    const passwordInput = $("#password");
                    const tipoActual = passwordInput.attr("type");

                    if (tipoActual === "password") {
                        passwordInput.attr("type", "text"); // Muestra el texto
                        $(this).text("Ocultar"); // Cambia el texto del botón
                    } else {
                        passwordInput.attr("type", "password"); // Oculta el texto
                        $(this).text("Mostrar"); // Restaura el texto del botón
                    }
                });

                // Obtiene los datos del texto de firma personalizado
                $.ajax({
                    url: "TryGetTextoCustom", // URL del servlet que devuelve los datos del usuario
                    type: "GET",
                    success: function (response) {
                        // Muestra el texto
                        $("#textocustom").text(response);
                    },
                    error: function () {
                        $("#textocustom").text("Error obteniendo la firma personalizada.");
                    }
                });

                $("#loginForm").submit(function (event) {
                    event.preventDefault(); // Evita que el formulario se envíe de manera tradicional

                    const usuario = $("#usuario").val();
                    const password = $("#password").val();

                    // Envía los datos al servlet usando AJAX
                    $.ajax({
                        url: "TryLogin", // URL del servlet
                        type: "POST",
                        data: {usuario: usuario, password: password},
                        success: function (response) {
                            if (response === "correcto") {
                                // Redirige al área personal si el login es exitoso
                                $("#error-message").text("");
                                window.location.href = "areapersonal.html";
                            } else if (response === "incorrecto") {
                                // Muestra el mensaje de error debajo del formulario
                                $("#error-message").text("Usuario o contraseña incorrectos");
                            } else {
                                // Muestra el mensaje de error de base de datos
                                $("#error-message").text("Error al contactar con la base de datos");
                            }
                        },
                        error: function () {
                            $("#error-message").text("Error en el servidor. Inténtelo de nuevo más tarde.");
                        }
                    });
                });
            });

            $("#iniciar-sesion").on("click", function (e) {
                e.preventDefault(); // Evita que el enlace redirija directamente
                // Redirige hacia la pagina de area personal
                window.location.href = "areapersonal.html";
            }
            );

            $("#cerrar-sesion").on("click", function (e) {
                e.preventDefault(); // Evita que el enlace redirija directamente
                // Realiza una solicitud AJAX para cerrar la sesión
                $.ajax({
                    url: "Logout", // URL del servlet que maneja el cierre de sesión
                    type: "POST",
                    success: function () {
                        window.location.href = "index.html";
                    },
                    error: function () {
                        alert("Error al intentar cerrar la sesión.");
                    }
                });
            }
            );
        </script>
    </body>
</html>
