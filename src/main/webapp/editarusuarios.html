<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar usuarios</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <style>
            table, th, td {
                border: 1px solid black;
                border-collapse: collapse; /* Evita bordes dobles */
            }
            th, td {
                padding: 10px;
                text-align: center;
            }
            th {
                background-color: darkgray;
            }
            div{
                margin: 20px;
                padding: 20px;
            }
            /* Estilos para el modal */
            .modal {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 600px;
                padding: 20px;
                background: white;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
                border-radius: 12px;
                z-index: 1000; /* Para estar por encima del contenido */
                display: none; /* Oculto por defecto */
            }

            /* Fondo oscuro detrás del modal */
            .overlay {
                position: fixed;
                margin: 0px;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999; /* Debajo del modal, pero por encima del resto */
                display: none;
            }
        </style>
    </head>
    <body>
        <h1>Modificar usuarios</h1>
        <div>
            <h2>Empleados</h2>
            <table id="tabla-empleados">
                <tbody>
                    <!-- Las filas se agregarán aquí -->
                </tbody>
            </table>
            <h2>Encargados</h2>
            <table id="tabla-encargados">
                <tbody>
                    <!-- Las filas se agregarán aquí -->
                </tbody>
            </table>
            <p id="error-consulta" style="color: red;"></p> <!-- Mensaje de error -->
            <button id="volver">Volver al área personal</button>
        </div>

        <div id="modal" class="modal">
            <h3 id="modal-titulo">¿Confirmar?</h3>
            <p id="modal-texto"></p>
            <form id="form-confirmar">
                <input type="text" id="modal-textbox" required>
                <button type="submit" id="modal-submit">Confirmar</button>
            </form>
            <p id="error-confirmacion" style="color: red;"></p> <!-- Mensaje de error -->
            <button onclick="cerrarModal()">Cancelar</button>
        </div>

        <div id="overlay" class="overlay" onclick="cerrarModal()"></div>
        <script>
            $(document).ready(function () {
                // Obtiene los datos del usuario desde el servlet
                $.ajax({
                    url: "TryGetUsuarios", // URL del servlet que devuelve los nombres de los usuarios
                    type: "GET",
                    success: function (response) {
                        // Muestra los datos de los usuarios en las tablas
                        try {
                            updatetabla(response.empleados, "empleado");
                            updatetabla(response.encargados, "encargado");
                        } catch (error) {
                            $("#error-consulta").text("Error al consultar la lista de usuarios. Verifica que tienes la sesión iniciada con un usuario autorizado.");
                        }
                    },
                    error: function () {
                        $("#error-consulta").text("Error al consultar la lista de usuarios. Verifica que tienes la sesión iniciada con un usuario autorizado.");
                    }
                });
            });

            function updatetabla(listanombres, rol) {
                let tabla;
                if (rol === "empleado") {
                    tabla = document.getElementById("tabla-empleados").getElementsByTagName("tbody")[0];
                } else {
                    tabla = document.getElementById("tabla-encargados").getElementsByTagName("tbody")[0];
                }

                tabla.innerHTML = "";
                listanombres.forEach(nombre => {
                    let fila = tabla.insertRow();
                    let celdanombre = fila.insertCell(0);
                    let celdacambiarnombre = fila.insertCell(1);
                    let celdacambiarrol = fila.insertCell(2);
                    let celdaborrar = fila.insertCell(3);

                    celdanombre.textContent = nombre;

                    const botoncambiarnombre = document.createElement("button");
                    botoncambiarnombre.textContent = "Cambiar nombre";
                    botoncambiarnombre.onclick = function () {
                        abrirModal(nombre, rol, "cambiarnombre");
                    };
                    celdacambiarnombre.appendChild(botoncambiarnombre);

                    const botoncambiarrol = document.createElement("button");
                    botoncambiarrol.textContent = "Cambiar rol";
                    botoncambiarrol.onclick = function () {
                        abrirModal(nombre, rol, "cambiarrol");
                    };
                    celdacambiarrol.appendChild(botoncambiarrol);

                    const botonborrar = document.createElement("button");
                    botonborrar.textContent = "Borrar usuario";
                    botonborrar.onclick = function () {
                        abrirModal(nombre, rol, "borrar");
                    };
                    celdaborrar.appendChild(botonborrar);
                });
            }

            function abrirModal(nombre, rol, accion) {

                if (accion === "cambiarnombre") {
                    document.getElementById("modal-texto").innerHTML = "Estás a punto de cambiar el nombre del usuario <b>" + nombre + "</b>. Introduce el nuevo nombre a continuación.";
                    document.getElementById("modal-submit").style = "";
                } else if (accion === "cambiarrol") {
                    document.getElementById("modal-texto").innerHTML = "Estás a punto de cambiar el rol del usuario <b>" + nombre + "</b>. Para confirmar esta acción, escribe el nombre completo del usuario a continuación. <b>ATENCIÓN: CAMBIAR DE EMPLEADO A ENCARGADO BORRARÁ TODOS SUS REGISTROS DE FORMA IRREVERSIBLE.</b>";
                    document.getElementById("modal-submit").style = "color: red;";
                } else { // Accion de borrar
                    document.getElementById("modal-texto").innerHTML = "Estás a punto de borrar el usuario <b>" + nombre + "</b>. Para confirmar esta acción, escribe el nombre completo del usuario a continuación. <b>ATENCIÓN: BORRAR UN USUARIO BORRARÁ TODOS SUS REGISTROS Y NOTAS DE FORMA IRREVERSIBLE.</b>";
                    document.getElementById("modal-submit").style = "color: red;";
                }

                document.getElementById("error-confirmacion").textContent = ""; // Reinicia el mensaje de error
                document.getElementById("modal-textbox").value = ""; // Reinicia la textbox
                modal.dataset.nombre = nombre; // Guarda los datos en el dataset del modal
                modal.dataset.rol = rol;
                modal.dataset.accion = accion;
                document.getElementById("modal").style.display = "block";
                document.getElementById("overlay").style.display = "block";
            }

            function cerrarModal() {
                document.getElementById("modal").style.display = "none";
                document.getElementById("overlay").style.display = "none";
            }


            $("#form-nota").submit(function (event) { // Manejo del formulario de publicar nota
                event.preventDefault(); // Evita que el formulario se envíe de manera tradicional
                const id = document.getElementById("submit-nota").name;
                const texto = $("#texto-nota").val();
                if (texto.length <= 255) {
                    // Envía los datos al servlet usando AJAX
                    $.ajax({
                        url: "TryCrearNota", // URL del servlet
                        type: "POST",
                        data: {idRegistro: id, textoNota: texto},
                        success: function (response) {
                            if (response === "correcto") {
                                // Recarga el modal para mostrar la nueva nota
                                abrirModal(id);
                            } else if (response === "no_autorizado") {
                                // Muestra el mensaje de error debajo del formulario
                                $("#error-nota").text("Error. Tu usuario no está autorizado para esta acción.");
                            } else {
                                // Muestra el mensaje de error debajo del formulario
                                $("#error-nota").text("Error desconocido. Intentelo de nuevo más tarde.");
                            }
                        },
                        error: function () {
                            $("#error-nota").text("Error al contactar con el servidor. Inténtelo de nuevo más tarde.");
                        }
                    });
                } else {
                    $("#error-nota").text("La nota no puede tener más de 255 caracteres.");
                }
            });

            $("#logout").on("click", function (e) {
                e.preventDefault(); // Evita que el enlace redirija directamente
                // Realiza una solicitud AJAX para cerrar la sesión
                $.ajax({
                    url: "Logout", // URL del servlet que maneja el cierre de sesión
                    type: "POST",
                    success: function () {
                        window.location.href = "index.html";
                    },
                    error: function () {
                        alert("Error al intentar cerrar la sesión.");
                    }
                });
            }
            );
        </script>
    </body>
</html>
